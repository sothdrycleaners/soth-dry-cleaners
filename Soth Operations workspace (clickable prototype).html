<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soth Operations</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5ff;--card:#fff;--ink:#0b1b4a;--mut:#566690;--line:#d9e3f8;--blue:#0a64e0;--or:#ff8a00;--ok:#0f9d58;--onok:#fff;--okbg:#d9f5e6;--soft:#e8f0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081029;--card:#0f1b42;--ink:#eaf0ff;--mut:#9eb0dd;--line:#22346b;--blue:#2f7ff5;--ok:#38d68f;--onok:#04210f;--okbg:#0e3a2a;--soft:#17275a}}
:root[data-theme="dark"]{--bg:#081029;--card:#0f1b42;--ink:#eaf0ff;--mut:#9eb0dd;--line:#22346b;--blue:#2f7ff5;--ok:#38d68f;--onok:#04210f;--okbg:#0e3a2a;--soft:#17275a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Nunito,ui-rounded,system-ui,sans-serif}
button,input{font-family:inherit}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{background:#fff;border-radius:14px;padding:8px;margin-bottom:12px}.logo img{width:100%;max-width:170px;display:block;margin:auto}
#nav{display:flex;flex-direction:column;gap:4px}
#nav a{display:flex;gap:10px;align-items:center;padding:0 14px;min-height:48px;border-radius:12px;color:var(--mut);text-decoration:none;font-weight:800}
#nav a.on{background:var(--blue);color:#fff}
#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side{margin-top:auto;font-size:13px;color:var(--mut);border-top:1px solid var(--line);padding-top:12px}
main{padding:24px clamp(14px,3vw,32px) 40px;min-width:0;max-width:1100px;width:100%}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.hd h1{margin:0;font-size:26px;flex:1}
.mlogo{display:none;height:42px;background:#fff;border-radius:10px;padding:3px}
h2{font-size:20px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.stats .card{margin:0}
.stat{text-align:left;color:inherit;font:inherit;display:block;width:100%}
button.stat{cursor:pointer}
.stat b{font-size:34px;line-height:1.1;display:block}.stat span{color:var(--mut);font-weight:700;font-size:14px}
.stat.ex{border-color:var(--or);border-width:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:24px 0 12px}.row h2{margin:0}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:0;font-weight:800;font-size:15px;background:var(--blue);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.or{background:var(--or);color:#2a1500}.btn.ghost{background:var(--soft);color:var(--ink)}.btn.ok{background:var(--ok);color:var(--onok)}
.btn:focus-visible,.chip:focus-visible,.oh:focus-visible,#nav a:focus-visible,.in:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:14px;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.in{display:block;width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card);color:var(--ink);font-size:16px;margin:0 0 14px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.pill.rcv{background:var(--soft);color:var(--mut)}.pill.prc{background:var(--blue);color:#fff}.pill.rdy{background:var(--okbg);color:var(--ok)}.pill.exp{background:var(--or);color:#2a1500}
.ord{padding:0;overflow:hidden}.rdyo{border-color:var(--ok)}
.oh{width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:14px 16px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) 170px 20px;gap:12px;align-items:center;min-height:64px}
.oh.t2{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) 20px}
.rec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.cu{font-weight:700;margin-top:2px}.mut{color:var(--mut)}.small{font-size:14px}
.m{font-size:14px;color:var(--mut);font-weight:700}
.chev{color:var(--mut);font-size:18px;text-align:center}
.pl{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;font-weight:800;color:var(--mut)}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.rdyo .bar i{background:var(--ok)}
.ob{border-top:1px solid var(--line);padding:4px 16px 16px}
.it{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:8px 14px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.it:last-of-type{border-bottom:0}.it .btn{width:100%}
.n{font-weight:800}.q{color:var(--mut)}.note{font-size:14px;color:var(--mut);margin-top:4px}
.rd{color:var(--ok);font-weight:800;margin:8px 0 0}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}.empty b{color:var(--ink);font-size:18px}.empty p{margin:4px 0 0}
.big{width:56px;height:56px;margin:0 auto 10px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;font-size:28px;font-weight:800}
.demo{margin-top:20px;border-style:dashed}.demo p{margin:4px 0 12px}
.th{padding:0;overflow:hidden}
.bub{max-width:85%;padding:10px 14px;border-radius:14px;margin:8px 0;background:var(--soft)}.bub.out{margin-left:auto;background:var(--blue);color:#fff}
.rep{display:flex;gap:8px;margin-top:10px}.rep .in{flex:1;margin:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--or)}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;color:var(--mut);font-weight:700}
.bars i{display:block;width:100%;max-width:48px;background:var(--blue);border-radius:8px 8px 0 0}
.hb{display:grid;grid-template-columns:90px 1fr 44px;gap:10px;align-items:center;margin:12px 0}.hb b{text-align:right}
#to{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 28px);z-index:30;text-align:center}
#to.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){
.app{display:block}
aside{position:fixed;top:auto;left:0;right:0;bottom:0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--line);z-index:20}
.logo,.side{display:none}
#nav{flex-direction:row;flex:1}
#nav a{flex:1;flex-direction:column;gap:2px;font-size:12px;padding:6px 2px;min-height:56px;justify-content:center;text-align:center}
main{padding-bottom:120px}.mlogo{display:block}.hd h1{font-size:22px}
.stats{grid-template-columns:repeat(2,1fr)}
.oh,.oh.t2{grid-template-columns:minmax(0,1fr) 24px;gap:8px}
.oh .chev{grid-column:2;grid-row:1}.oh .m,.oh .p{grid-column:1/-1}
.it{grid-template-columns:1fr}
.hb{grid-template-columns:76px 1fr 40px}
#to{bottom:96px}
}
</style></head>

<script>

const mk=()=>[

{id:'SOTH-2039',c:'Nakato Sarah',cid:'C-1190',b:'Bugolobi',ag:'Faith N.',t:'Today 07:50',ex:1,it:[I('Wedding gown',1,'Beaded bodice, hand clean only',1),I('Veil',1,'',2)]},
{id:'SOTH-2038',c:'Mukasa Peter',cid:'C-0455',b:'Kampala Road',ag:'Moses K.',t:'Yesterday 17:20',ex:0,it:[I('Duvet, king',1,'',2),I('Bed sheets',4,'',2),I('Curtains, pair',2,'Heavy dust',2)]},
{id:'SOTH-2037',c:'Atim Joy',cid:'C-1311',b:'Kira',ag:'Brenda A.',t:'Yesterday 16:05',ex:0,it:[I('Gomesi',2,'Clean the sash separately',2),I('Blouse',3,'',1)]},

{id:'SOTH-2035',c:'Nabirye Ruth',cid:'C-0921',b:'Bugolobi',ag:'Moses K.',t:'Yesterday 11:10',ex:0,it:[I('Dress',2,'',2),I('Scarf',2,'Silk, cool iron',1)]}];
const M=[
{id:1,w:'Front desk, Kira',r:'Order SOTH-2041',u:1,m:[['in','The customer collects at 5 pm. Can the suit go first?'],['in','The oil stain is on the left cuff.']]},
{id:2,w:'Front desk, Bugolobi',r:'Order SOTH-2039',u:1,m:[['in','Bride is asking about the gown. Any update?'],['out','Gown is in processing. Veil is already ready.']]},
{id:3,w:'Supervisor',r:'General',u:0,m:[['in','Please clear express orders before noon.'],['out','Understood.']]}];
const BR=['Kira','Ntinda','Bugolobi','Kampala Rd'];
const R={d:{t:'Items completed by hour',done:41,ord:12,tat:'3 h 10 m',ex:'96%',h:[3,6,9,7,5,8,3],l:['8am','9am','10am','11am','12pm','1pm','2pm'],br:[14,11,9,7]},
w:{t:'Items completed by day',done:268,ord:82,tat:'3 h 40 m',ex:'93%',h:[38,41,35,44,40,39,31],l:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],br:[96,74,52,46]},
m:{t:'Items completed by week',done:1104,ord:352,tat:'3 h 25 m',ex:'94%',h:[250,281,266,301],l:['Wk 1','Wk 2','Wk 3','Wk 4'],br:[420,332,248,205]}};
const S={o:mk(),f:'all',q:'',open:new Set(),mo:0,rg:'d'};
const st=o=>o.it.every(x=>x.s==2)?'rdy':o.it.every(x=>x.s==0)?'rcv':'prc';
const cnt=o=>o.it.filter(x=>x.s==2).length;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EM=(t,s)=>`<div class="card empty"><div class="big">✓</div><b>${t}</b><p>${s}</p></div>`;
let tm;const toast=m=>{const t=$('#to');t.textContent=m;t.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('on'),3400)};
const oh=o=>{const k=st(o),n=cnt(o),t=o.it.length;
return `<div class="a"><b>${o.id}</b> ${o.ex?'<span class="pill exp">Express</span>':''}<div class="cu">${o.c}</div><div class="m">Customer ID ${o.cid}</div></div><div class="m">${o.b} branch<br>Agent ${o.ag}<br>Received ${o.t}</div><div class="p"><div class="pl"><span class="pill ${k}">${LB[k]}</span><span>${n} of ${t} items ready</span></div><div class="bar"><i style="width:${n/t*100}%"></i></div></div>`};
const itH=(o,i)=>{const x=o.it[i],k=C[x.s],a=`data-id="${o.id}" data-i="${i}"`;
const b=x.s==0?`<button class="btn" data-a="go" ${a}>Start processing</button>`:x.s==1?`<button class="btn ok" data-a="go" ${a}>Mark ready</button>`:`<button class="btn ghost" data-a="back" ${a}>Reopen item</button>`;
return `<div class="it"><div><div class="n">${x.n} <span class="q">×${x.q}</span> <span class="pill ${k}">${LB[k]}</span></div>${x.note?`<div class="note"><b>Desk note:</b> ${x.note}</div>`:''}</div>${b}</div>`};
const ordH=o=>{const op=S.open.has(o.id),k=st(o);
return `<div class="card ord ${k=='rdy'?'rdyo':''}"><button class="oh" data-a="tg" data-id="${o.id}" aria-expanded="${op}">${oh(o)}<span class="chev">${op?'▴':'▾'}</span></button>${op?`<div class="ob">${o.it.map((x,i)=>itH(o,i)).join('')}${k=='rdy'?'<p class="rd">All items ready. Waiting for the desk agent to hand over and record delivery.</p>':''}</div>`:''}</div>`};
const ql=()=>{const q=S.q.toLowerCase(),L=S.o.filter(o=>(S.f=='all'||(S.f=='ex'?o.ex:st(o)==S.f))&&(o.id+o.c+o.cid+o.b).toLowerCase().includes(q));
return L.length?L.map(ordH).join(''):S.o.length?EM('No orders match','Try another filter or clear the search.'):EM('The queue is clear','New orders appear here as soon as a desk agent receives them.')};
const V={
dashboard(){const it=S.o.flatMap(o=>o.it),c=s=>it.filter(x=>x.s==s).length;
const cd=(l,n,f,cl)=>`<button class="card stat ${cl||''}" data-a="gq" data-f="${f}"><b>${n}</b><span>${l}</span></button>`;
return `<div class="stats">${cd('Newly received items',c(0),'rcv')}${cd('Processing items',c(1),'prc')}${cd('Ready items',c(2),'rdy')}${cd('Express orders',S.o.filter(o=>o.ex).length,'ex','ex')}</div>
<div class="row"><h2>Recent orders</h2><a class="btn or" href="#queue">Open work queue</a></div>
${S.o.length?S.o.slice(0,4).map(o=>`<button class="oh rec" data-a="gq" data-f="all" data-id="${o.id}">${oh(o)}<span class="chev">›</span></button>`).join(''):EM('The queue is clear','New orders appear here as soon as a desk agent receives them.')}
<p class="mut small">Operations moves each item from Received to Processing to Ready. Desk agents record delivery in the main system, and delivered orders leave this queue.</p>`},
queue(){const n=k=>S.o.filter(o=>k=='all'||(k=='ex'?o.ex:st(o)==k)).length;
const ch=[['all','All'],['rcv','Received'],['prc','Processing'],['rdy','Ready'],['ex','Express']].map(([k,l])=>`<button class="chip ${S.f==k?'on':''}" data-a="fl" data-f="${k}">${l} ${n(k)}</button>`).join('');
return `<div class="chips">${ch}</div><input id="qs" class="in" type="search" placeholder="Search order, customer, ID or branch" aria-label="Search orders" value="${esc(S.q)}"><div id="ql">${ql()}</div>
<div class="card demo"><b>Demo controls</b><p class="mut small">Operations has no Delivered button. Use these to play the desk agent’s side.</p><div class="chips"><button class="btn ghost" data-a="dl">Desk agent delivers a Ready order</button><button class="btn ghost" data-a="cl">Empty the queue</button><button class="btn ghost" data-a="rs">Reset sample orders</button></div></div>`},
messages(){return M.map(t=>{const op=S.mo==t.id,l=t.m[t.m.length-1];
return `<div class="card th"><button class="oh t2" data-a="mt" data-id="${t.id}" aria-expanded="${op}"><div class="a"><b>${t.w}</b> ${t.u?'<span class="dot" title="Unread"></span>':''}<div class="m">${t.r}</div></div><div class="m">${esc(l[1])}</div><span class="chev">${op?'▴':'▾'}</span></button>${op?`<div class="ob">${t.m.map(m=>`<div class="bub ${m[0]}">${esc(m[1])}</div>`).join('')}<div class="rep"><input id="ri" class="in" placeholder="Write a reply" aria-label="Reply"><button class="btn" data-a="sd">Send</button></div></div>`:''}</div>`}).join('')},
reports(){const r=R[S.rg],mx=Math.max(...r.h),bm=Math.max(...r.br),sc=(l,v)=>`<div class="card stat"><b>${v}</b><span>${l}</span></div>`;
const ch=[['d','Today'],['w','7 days'],['m','30 days']].map(([k,l])=>`<button class="chip ${S.rg==k?'on':''}" data-a="rg" data-f="${k}">${l}</button>`).join('');
return `<div class="chips">${ch}</div><div class="stats">${sc('Items completed',r.done)}${sc('Orders cleared',r.ord)}${sc('Average turnaround',r.tat)}${sc('Express on time',r.ex)}</div>
<div class="card"><h2>${r.t}</h2><div class="bars">${r.h.map((v,i)=>`<div><span>${v}</span><i style="height:${v/mx*78}%"></i><span>${r.l[i]}</span></div>`).join('')}</div></div>
<div class="card"><h2>Items completed by branch</h2>${BR.map((n,i)=>`<div class="hb"><span>${n}</span><div class="bar"><i style="width:${r.br[i]/bm*100}%"></i></div><b>${r.br[i]}</b></div>`).join('')}</div>`}};
const T={dashboard:'Operations dashboard',queue:'Work queue',messages:'Messages',reports:'Reports'};
const NV=[['dashboard','Dashboard','<path d="M3 11l9-8 9 8M5 10v10h14V10"/>'],['queue','Work queue','<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>'],['messages','Messages','<path d="M4 5h16v11H9l-5 4z"/>'],['reports','Reports','<path d="M5 20V10M12 20V4M19 20v-7"/>']];
const cur=()=>{const h=location.hash.slice(1);return T[h]?h:'dashboard'};
function render(){const v=cur();$('#t').textContent=T[v];document.title='Soth Operations: '+T[v];
$('#nav').innerHTML=NV.map(([k,l,p])=>`<a href="#${k}" class="${k==v?'on':''}"${k==v?' aria-current="page"':''}><svg viewBox="0 0 24 24">${p}</svg>${l}</a>`).join('');
$('#v').innerHTML=V[v]()}
function send(){const t=M.find(x=>x.id==S.mo),i=$('#ri');if(!t||!i)return;const s=i.value.trim();if(!s)return;t.m.push(['out',s]);render();$('#ri').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
const a=b.dataset.a,id=b.dataset.id,o=S.o.find(x=>x.id==id);
if(a=='tg'){S.open.has(id)?S.open.delete(id):S.open.add(id)}
else if(a=='go'||a=='back'){const x=o.it[+b.dataset.i];x.s=a=='go'?x.s+1:1;if(a=='go'&&st(o)=='rdy')toast(o.id+' is fully ready. The desk agent can now hand it over.')}
else if(a=='fl')S.f=b.dataset.f;
else if(a=='gq'){S.f=b.dataset.f||'all';if(id)S.open.add(id);if(cur()=='queue')render();else location.hash='queue';return}
else if(a=='dl'){const r=S.o.find(x=>st(x)=='rdy');if(r){S.o=S.o.filter(x=>x!=r);S.open.delete(r.id);toast(r.id+' delivered by the desk agent and removed from the queue.')}else toast('No order is fully ready yet. Finish every item in one order first.')}
else if(a=='cl'){S.o=[];S.open.clear()}
else if(a=='rs'){S.o=mk();S.open.clear();S.f='all';S.q=''}
else if(a=='mt'){const t=M.find(x=>x.id==id);S.mo=S.mo==t.id?0:t.id;t.u=0}
else if(a=='sd'){send();return}
else if(a=='rg')S.rg=b.dataset.f;
render()});
document.addEventListener('input',e=>{if(e.target.id=='qs'){S.q=e.target.value;$('#ql').innerHTML=ql()}});
document.addEventListener('keydown',e=>{if(e.target.id=='ri'&&e.key=='Enter')send()});
$('#th').onclick=()=>{const d=document.documentElement,c=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=c=='dark'?'light':'dark'};
$('.mlogo').src=$('.logo img').src;
addEventListener('hashchange',render);render();
</script>
</body></html>
